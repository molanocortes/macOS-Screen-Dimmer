<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" fill="none" role="img" aria-label="The macOS window stack. Penumbra's shade sits at level 1000, above app windows, the Dock, the menu bar and open menus. Its control window is at 1002 and the cursor is above everything. Clicks pass through the shade."><defs><marker id="cdark" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L7 4L0 7z" fill="#4c9dff"/></marker></defs><text x="0" y="14" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" letter-spacing="0" text-anchor="start" fill="#98989d">Window level, low to high</text><polygon points="40,330 290,330 368,300 118,300" fill="#1c1c1e" fill-opacity="1" stroke="#48484a" stroke-width="1.2" stroke-linejoin="round"/><path d="M335.0 315.0H394" stroke="#48484a" stroke-width="1"/><text x="488" y="314.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="end" fill="#f5f5f7" font-weight="600">0</text><text x="502" y="314.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="start" fill="#f5f5f7" font-weight="600">App windows</text><text x="502" y="329.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" letter-spacing="0" text-anchor="start" fill="#98989d">NSNormalWindowLevel  ·  full-screen Spaces included</text><polygon points="40,288 290,288 368,258 118,258" fill="#1c1c1e" fill-opacity="1" stroke="#48484a" stroke-width="1.2" stroke-linejoin="round"/><path d="M335.0 273.0H394" stroke="#48484a" stroke-width="1"/><text x="488" y="272.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="end" fill="#f5f5f7" font-weight="600">20</text><text x="502" y="272.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="start" fill="#f5f5f7" font-weight="600">Dock</text><text x="502" y="287.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" letter-spacing="0" text-anchor="start" fill="#98989d">NSDockWindowLevel</text><polygon points="40,246 290,246 368,216 118,216" fill="#1c1c1e" fill-opacity="1" stroke="#48484a" stroke-width="1.2" stroke-linejoin="round"/><path d="M335.0 231.0H394" stroke="#48484a" stroke-width="1"/><text x="488" y="230.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="end" fill="#f5f5f7" font-weight="600">24</text><text x="502" y="230.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="start" fill="#f5f5f7" font-weight="600">Menu bar</text><text x="502" y="245.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" letter-spacing="0" text-anchor="start" fill="#98989d">NSMainMenuWindowLevel</text><polygon points="40,204 290,204 368,174 118,174" fill="#1c1c1e" fill-opacity="1" stroke="#48484a" stroke-width="1.2" stroke-linejoin="round"/><path d="M335.0 189.0H394" stroke="#48484a" stroke-width="1"/><text x="488" y="188.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="end" fill="#f5f5f7" font-weight="600">101</text><text x="502" y="188.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="start" fill="#f5f5f7" font-weight="600">Open menus</text><text x="502" y="203.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" letter-spacing="0" text-anchor="start" fill="#98989d">NSPopUpMenuWindowLevel</text><polygon points="40,162 290,162 368,132 118,132" fill="#000000" fill-opacity="0.78" stroke="#4c9dff" stroke-width="1.6" stroke-linejoin="round"/><path d="M335.0 147.0H394" stroke="#4c9dff" stroke-width="1"/><text x="488" y="146.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="end" fill="#4c9dff" font-weight="600">1000</text><text x="502" y="146.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="start" fill="#4c9dff" font-weight="600">Penumbra shade</text><text x="502" y="161.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" letter-spacing="0" text-anchor="start" fill="#98989d">NSScreenSaverWindowLevel  ·  one black window per display</text><polygon points="40,120 290,120 368,90 118,90" fill="#1c1c1e" fill-opacity="1" stroke="#4c9dff" stroke-width="1.4" stroke-linejoin="round"/><path d="M335.0 105.0H394" stroke="#4c9dff" stroke-width="1"/><text x="488" y="104.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="end" fill="#4c9dff" font-weight="600">1002</text><text x="502" y="104.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="start" fill="#4c9dff" font-weight="600">Control window</text><text x="502" y="119.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" letter-spacing="0" text-anchor="start" fill="#98989d">two above the shade, so the slider is never dimmed</text><polygon points="40,78 290,78 368,48 118,48" fill="#1c1c1e" fill-opacity="1" stroke="#48484a" stroke-width="1.2" stroke-linejoin="round"/><path d="M335.0 63.0H394" stroke="#48484a" stroke-width="1"/><text x="488" y="62.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="end" fill="#f5f5f7" font-weight="600">2147483630</text><text x="502" y="62.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="0" text-anchor="start" fill="#f5f5f7" font-weight="600">Cursor</text><text x="502" y="77.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" letter-spacing="0" text-anchor="start" fill="#98989d">kCGCursorWindowLevel  ·  above every window, never dimmed</text><path d="M163.0 125V312.0" stroke="#4c9dff" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#cdark)"/><circle cx="163.0" cy="147.0" r="4.5" fill="#1c1c1e" stroke="#4c9dff" stroke-width="1.4"/><text x="40" y="358" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" letter-spacing="0" text-anchor="start" fill="#98989d">A click falls through the shade (ignoresMouseEvents) and lands on the app below.</text></svg>