<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" fill="none" role="img" aria-label="The macOS window stack. Penumbra's shade sits at level 1000, above app windows, the Dock, the menu bar and open menus. Its control window is at 1002 and the cursor is above everything. Clicks pass through the shade."><defs><marker id="clight" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L7 4L0 7z" fill="#d94e12"/></marker></defs><text x="0" y="14" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9" letter-spacing="1.6" text-anchor="start" fill="#6e6b62">WINDOW LEVEL, LOW TO HIGH</text><polygon points="40,330 290,330 368,300 118,300" fill="#f1efe9" fill-opacity="1" stroke="#c6c1b2" stroke-width="1.2" stroke-linejoin="round"/><path d="M335.0 315.0H394" stroke="#c6c1b2" stroke-width="1"/><text x="488" y="314.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="0.4" text-anchor="end" fill="#191713" font-weight="600">0</text><text x="502" y="314.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.3" text-anchor="start" fill="#191713" font-weight="600">APP WINDOWS</text><text x="502" y="328.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.3" text-anchor="start" fill="#6e6b62">NSNormalWindowLevel  ·  full-screen Spaces included</text><polygon points="40,288 290,288 368,258 118,258" fill="#f1efe9" fill-opacity="1" stroke="#c6c1b2" stroke-width="1.2" stroke-linejoin="round"/><path d="M335.0 273.0H394" stroke="#c6c1b2" stroke-width="1"/><text x="488" y="272.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="0.4" text-anchor="end" fill="#191713" font-weight="600">20</text><text x="502" y="272.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.3" text-anchor="start" fill="#191713" font-weight="600">DOCK</text><text x="502" y="286.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.3" text-anchor="start" fill="#6e6b62">NSDockWindowLevel</text><polygon points="40,246 290,246 368,216 118,216" fill="#f1efe9" fill-opacity="1" stroke="#c6c1b2" stroke-width="1.2" stroke-linejoin="round"/><path d="M335.0 231.0H394" stroke="#c6c1b2" stroke-width="1"/><text x="488" y="230.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="0.4" text-anchor="end" fill="#191713" font-weight="600">24</text><text x="502" y="230.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.3" text-anchor="start" fill="#191713" font-weight="600">MENU BAR</text><text x="502" y="244.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.3" text-anchor="start" fill="#6e6b62">NSMainMenuWindowLevel</text><polygon points="40,204 290,204 368,174 118,174" fill="#f1efe9" fill-opacity="1" stroke="#c6c1b2" stroke-width="1.2" stroke-linejoin="round"/><path d="M335.0 189.0H394" stroke="#c6c1b2" stroke-width="1"/><text x="488" y="188.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="0.4" text-anchor="end" fill="#191713" font-weight="600">101</text><text x="502" y="188.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.3" text-anchor="start" fill="#191713" font-weight="600">OPEN MENUS</text><text x="502" y="202.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.3" text-anchor="start" fill="#6e6b62">NSPopUpMenuWindowLevel</text><polygon points="40,162 290,162 368,132 118,132" fill="#191713" fill-opacity="0.62" stroke="#d94e12" stroke-width="1.6" stroke-linejoin="round"/><path d="M335.0 147.0H394" stroke="#d94e12" stroke-width="1"/><text x="488" y="146.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="0.4" text-anchor="end" fill="#d94e12" font-weight="600">1000</text><text x="502" y="146.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.3" text-anchor="start" fill="#d94e12" font-weight="600">PENUMBRA SHADE</text><text x="502" y="160.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.3" text-anchor="start" fill="#6e6b62">NSScreenSaverWindowLevel  ·  one black window per display</text><polygon points="40,120 290,120 368,90 118,90" fill="#f1efe9" fill-opacity="1" stroke="#d94e12" stroke-width="1.4" stroke-linejoin="round"/><path d="M335.0 105.0H394" stroke="#d94e12" stroke-width="1"/><text x="488" y="104.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="0.4" text-anchor="end" fill="#d94e12" font-weight="600">1002</text><text x="502" y="104.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.3" text-anchor="start" fill="#d94e12" font-weight="600">CONTROL WINDOW</text><text x="502" y="118.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.3" text-anchor="start" fill="#6e6b62">two above the shade, so the slider is never dimmed</text><polygon points="40,78 290,78 368,48 118,48" fill="#f1efe9" fill-opacity="1" stroke="#c6c1b2" stroke-width="1.2" stroke-linejoin="round"/><path d="M335.0 63.0H394" stroke="#c6c1b2" stroke-width="1"/><text x="488" y="62.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="11" letter-spacing="0.4" text-anchor="end" fill="#191713" font-weight="600">2147483630</text><text x="502" y="62.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.3" text-anchor="start" fill="#191713" font-weight="600">CURSOR</text><text x="502" y="76.0" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9.5" letter-spacing="0.3" text-anchor="start" fill="#6e6b62">kCGCursorWindowLevel  ·  above every window, never dimmed</text><path d="M163.0 125V312.0" stroke="#d94e12" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#clight)"/><circle cx="163.0" cy="147.0" r="4.5" fill="#f1efe9" stroke="#d94e12" stroke-width="1.4"/><text x="40" y="358" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="9" letter-spacing="1.2" text-anchor="start" fill="#6e6b62">A CLICK FALLS THROUGH THE SHADE (ignoresMouseEvents) AND LANDS ON THE APP BELOW</text></svg>